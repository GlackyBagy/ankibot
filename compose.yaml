services:
  anki:
    image: thisisnttheway/headless-anki:latest
    user: "0:0"
    environment:
      - QTWEBENGINE_DISABLE_SANDBOX=1
    volumes:
      - ./anki_data:/data
    # The AnkiConnect symlink is baked into the image's own /data at build
    # time, so bind-mounting a host directory over /data wipes it out.
    # Recreate it on every start before handing off to the image's own entrypoint.
    command: >
      /bin/bash -c "mkdir -p /data/addons21 &&
      ln -sf /app/anki-connect/plugin /data/addons21/AnkiConnectDev &&
      exec /bin/bash /app/startup.sh"
    networks:
      ankibot_default:
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate
    user: "0:0"
    volumes:
      - libretranslate_data:/home/libretranslate/.local/share/argos-translate
    networks:
      - ankibot_default
    restart: unless-stopped

  bot:
    image: ghcr.io/glackybagy/ankibot:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      tags:
        - ankibot:latest
    env_file:
      - .env
    environment:
      - ANKI_CONNECT_ADDRESS=http://anki:8765
      - LIBRETRANSLATE_ADDRESS=http://libretranslate:5000
    networks:
      - ankibot_default
    restart: unless-stopped
    depends_on:
      - anki
      - libretranslate


networks:
  ankibot_default:

volumes:
  libretranslate_data: